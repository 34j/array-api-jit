[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "array-api-jit"
version = "1.0.0"
description = "JIT decorator supporting multiple array API compatible libraries"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "array-api-compat>=1.11.2",
]
urls."Bug Tracker" = "https://github.com/34j/array-api-jit/issues"
urls.Changelog = "https://github.com/34j/array-api-jit/blob/main/CHANGELOG.md"
urls.documentation = "https://array-api-jit.readthedocs.io"
urls.repository = "https://github.com/34j/array-api-jit"

[dependency-groups]
dev = [
  "cm-time>=0.1.2",
  "jax>=0.4.30",
  "numba>=0.60",
  "packaging-34j[test]",
  "torch>=2.7.1",
  "ty>=0.0.99",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.extend-per-file-ignores."/**/src/**/*" = [
  "C901",
  "PLC0415",
]
lint.extend-per-file-ignores."/**/tests/**/*" = [
  "PLC0415",
  "RUF005",
]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
